name: Publish to npm

# Publishes with npm Trusted Publishing (OIDC): no npm token is stored in GitHub.
# One-time setup on npmjs.com -> package -> Settings -> Trusted Publisher -> GitHub Actions:
#   Organization or user: lvlrSajjad
#   Repository:           react-native-circle-reveal-view
#   Workflow filename:    publish.yml
#   Environment name:     (leave empty)

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # lets npm mint a short-lived token from the GitHub OIDC identity

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Upgrade npm (trusted publishing needs npm >= 11.5.1)
        run: npm install -g npm@latest && npm --version
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci
      - name: Check whether this version is already on npm
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already published, skipping"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        if: steps.check.outputs.published == 'false'
        run: npm publish --provenance --access public
